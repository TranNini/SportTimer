# Reachable from other devices in the home network
server.address=0.0.0.0
# 8080 is used by the Vocab app, 8081 by TradeLog
server.port=8082

# The jar gives every file the same 1980 date, so browsers would keep old copies of app.js
# and style.css. Make them ask for the current file every time (offline, sw.js answers from its cache).
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true
